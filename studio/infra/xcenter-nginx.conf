server {
    listen 80;
    server_name persona.xcenter.it persona-sites.xcenter.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name persona.xcenter.it;
    include /etc/nginx/snippets/xcenter-deny-hidden.conf;
    ssl_certificate /etc/letsencrypt/live/xcenter.it-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xcenter.it-0002/privkey.pem;
    client_max_body_size 42m;
    location / {
        proxy_pass http://127.0.0.1:18130;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    listen 443 ssl;
    server_name persona-sites.xcenter.it;
    include /etc/nginx/snippets/xcenter-deny-hidden.conf;
    ssl_certificate /etc/letsencrypt/live/xcenter.it-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xcenter.it-0002/privkey.pem;
    client_max_body_size 16k;
    location /_tls/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:18131;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
    }
}
