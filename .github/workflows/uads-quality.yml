name: UADS source quality
on:
  push:
    branches: [testing]
  pull_request:
    branches: [testing, beta, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uads-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: python -m pip install jsonschema==4.25.1
      - run: python scripts/validate-uads.py
      - run: npm ci
        working-directory: studio
      - run: npm run format:check && npm run check && npm test && npm audit --omit=dev --audit-level=high
        working-directory: studio
